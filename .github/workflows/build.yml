name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix Licenses
        run: |
          echo "$ANDROID_HOME"
          ls $ANDROID_HOME/cmdline-tools/
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.1" "platforms;android-34" || true

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5

      - name: Create Private Keystore - SAFE like WhatsApp
        run: |
          rm -f android/app/mykey.jks
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/mykey.jks -storepass ${{ secrets.KEYSTORE_PASSWORD }} -alias ${{ secrets.KEY_ALIAS }} -keypass ${{ secrets.KEYSTORE_PASSWORD }} -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=EdgeGlow, OU=Pro, O=EdgeGlowPro, L=Manglaur, S=Uttarakhand, C=IN"

      - name: Build Signed APK
        working-directory: ./android
        run: gradle assembleRelease -Pandroid.injected.signing.store.file=$PWD/app/mykey.jks -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Edge-Glow-FINAL-Download
          path: android/app/build/outputs/apk/release/*.apk
