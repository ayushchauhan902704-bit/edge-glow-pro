name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept All Licenses
        run: |
          yes | sdkmanager --licenses
          yes | sdkmanager --sdk_root=$ANDROID_HOME "build-tools;33.0.1" "platforms;android-34"

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5

      - name: Create Keystore
        run: keytool -genkey -v -keystore android/app/mykey.jks -storepass 123456 -alias mykey -keypass 123456 -keyalg RSA -validity 10000 -dname "CN=EdgeGlow"

      - name: Build Signed APK
        working-directory: ./android
        run: |
          gradle assembleRelease -Pandroid.injected.signing.store.file=$PWD/app/mykey.jks -Pandroid.injected.signing.store.password=123456 -Pandroid.injected.signing.key.alias=mykey -Pandroid.injected.signing.key.password=123456

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Edge-Glow-FINAL-Download
          path: android/app/build/outputs/apk/release/*.apk
